<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinom NMS - NOC VPN Dashboard</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(17, 24, 39, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-primary: #6366f1; /* Indigo */
            --accent-secondary: #06b6d4; /* Cyan */
            --status-success: #10b981; /* Green */
            --status-error: #ef4444; /* Red */
            --status-warning: #f59e0b; /* Yellow */
            --shadow-glow: 0 0 20px rgba(99, 102, 241, 0.15);
            --transition-speed: 0.25s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-logo {
            font-family: 'Outfit', sans-serif;
        }

        /* ── Header ── */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.5rem;
            color: #fff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .brand-name {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #ffffff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 0.75rem;
            color: var(--accent-secondary);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-top: -0.2rem;
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .vpn-status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--status-success);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .vpn-status-badge.disconnected {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: var(--status-warning);
        }

        .vpn-pulse {
            width: 8px;
            height: 8px;
            background-color: currentColor;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px currentColor;
            animation: pulse 2s infinite;
        }

        .btn-settings {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed);
        }

        .btn-settings:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ── Container ── */
        .container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* ── Banner/Status Route ── */
        .route-status-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-glow);
            position: relative;
            overflow: hidden;
        }

        .route-status-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-primary);
        }

        .route-info-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .route-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .route-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
        }

        .route-value span.highlight {
            color: var(--status-success);
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.3);
        }

        .btn-disconnect {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border: none;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
            transition: all var(--transition-speed);
        }

        .btn-disconnect:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
        }

        /* ── Controls Grid ── */
        .search-bar {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: 100%;
            max-width: 400px;
        }

        .search-input {
            background: transparent;
            border: none;
            color: white;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        /* ── Cards Grid ── */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            backdrop-filter: blur(10px);
            transition: all var(--transition-speed);
            position: relative;
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3), 0 0 15px rgba(99, 102, 241, 0.05);
        }

        .card.active-route {
            border-color: var(--status-success);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.15);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .reseller-title {
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1.3;
            color: #fff;
        }

        .reseller-index {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .status-badge-inline {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--status-success);
        }

        .status-badge-inline.offline {
            color: var(--text-secondary);
        }

        .status-badge-inline.offline .vpn-pulse {
            background-color: var(--text-secondary);
            box-shadow: none;
            animation: none;
        }

        .card-details {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0.75rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            font-size: 0.85rem;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .detail-label {
            color: var(--text-secondary);
        }

        .detail-value {
            font-weight: 600;
            font-family: monospace;
            color: #e5e7eb;
        }

        .action-button-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: auto;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), #4f46e5);
            border: none;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all var(--transition-speed);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary.connected {
            background: var(--status-success);
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.2);
        }

        .btn-primary.connected:hover {
            background: #059669;
        }

        .link-tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .btn-tool {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-speed);
            text-align: center;
            text-decoration: none;
        }

        .btn-tool:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* ── Modal Settings ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .btn-close {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: white;
            outline: none;
            font-size: 0.95rem;
            transition: border-color var(--transition-speed);
        }

        .form-input:focus {
            border-color: var(--accent-primary);
        }

        /* ── Animations ── */
        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
                box-shadow: 0 0 12px currentColor;
            }
            100% {
                transform: scale(0.9);
                opacity: 0.6;
            }
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-secondary);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            color: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
        }

        .toast.active {
            transform: translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media(max-width: 640px) {
            header {
                padding: 1rem;
            }
            .container {
                padding: 1rem;
                gap: 1.5rem;
            }
            .route-status-panel {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .btn-disconnect {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-section">
            <div class="logo-icon">J</div>
            <div>
                <div class="brand-name">JINOM NMS</div>
                <div class="brand-sub">NOC VPN Control</div>
            </div>
        </div>
        <div class="user-controls">
            <div id="vpn-badge" class="vpn-status-badge disconnected">
                <span class="vpn-pulse"></span>
                <span id="vpn-badge-text">Detecting VPN...</span>
            </div>
            <button class="btn-settings" id="open-vpn-setup" title="Setup Client VPN" style="margin-right: 0.5rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </button>
            <button class="btn-settings" id="open-settings" title="Pengaturan API Key">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <div class="container">
        
        <!-- Status Panel -->
        <div class="route-status-panel">
            <div class="route-info-group">
                <div class="route-label">Sesi Routing Aktif Anda</div>
                <div id="routing-value" class="route-value">Tidak ada routing aktif. Hubungkan salah satu reseller di bawah.</div>
            </div>
            <button class="btn-disconnect" id="clear-routing-btn" style="display: none;">Putus Jalur Routing</button>
        </div>

        <!-- Controls/Search -->
        <div class="search-bar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="search-box" placeholder="Cari Reseller...">
        </div>

        <!-- Cards Container -->
        <div class="cards-grid" id="tunnels-container">
            <!-- Loading Indicator -->
            <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-secondary);">
                Mengambil data terowongan VPN...
            </div>
        </div>

    </div>

    <!-- Modal Settings -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Konfigurasi API</h3>
                <button class="btn-close" id="close-settings">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label" for="api-key-input">Jinom NMS X-API-Key</label>
                <input type="password" class="form-input" id="api-key-input" placeholder="Masukkan kunci API Anda...">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
                <button class="btn-tool" style="padding: 0.75rem 1.25rem;" id="save-settings">Simpan Kunci</button>
            </div>
        </div>
    </div>

    <!-- Modal VPN Setup -->
    <div class="modal-overlay" id="vpn-setup-modal">
        <div class="modal" style="max-width: 500px;">
            <div class="modal-header">
                <h3 class="modal-title">Setup Klien VPN (WireGuard)</h3>
                <button class="btn-close" id="close-vpn-setup">&times;</button>
            </div>
            
            <!-- Step 1: Input Name -->
            <div id="vpn-setup-step1">
                <div class="form-group">
                    <label class="form-label" for="technician-name-input">Nama Teknisi / Nama Laptop</label>
                    <input type="text" class="form-input" id="technician-name-input" placeholder="Contoh: Laptop-Budi, NOC-Roni">
                </div>
                <button class="btn-primary" style="width: 100%;" id="generate-vpn-btn">Generate Profil VPN</button>
            </div>

            <!-- Step 2: Show Config -->
            <div id="vpn-setup-step2" style="display: none; flex-direction: column; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Konfigurasi WireGuard Anda (IP: <span id="allocated-ip-text" style="color: var(--status-success); font-weight: bold;"></span>)</label>
                    <textarea class="form-input" id="vpn-config-textarea" readonly style="font-family: monospace; font-size: 0.8rem; height: 200px; resize: none;"></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
                    <button class="btn-tool" id="copy-vpn-config">Copy Text</button>
                    <button class="btn-tool" id="download-vpn-config">Download .conf</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Notifikasi</div>

    <script>
        // Global State
        let tunnels = [];
        let activeRouteTunnelId = null;
        let activeTechnicianIp = "";

        // Elements
        const tunnelsContainer = document.getElementById("tunnels-container");
        const searchBox = document.getElementById("search-box");
        const routingValue = document.getElementById("routing-value");
        const clearRoutingBtn = document.getElementById("clear-routing-btn");
        const vpnBadge = document.getElementById("vpn-badge");
        const vpnBadgeText = document.getElementById("vpn-badge-text");
        const settingsModal = document.getElementById("settings-modal");
        const openSettingsBtn = document.getElementById("open-settings");
        const closeSettingsBtn = document.getElementById("close-settings");
        const saveSettingsBtn = document.getElementById("save-settings");
        const apiKeyInput = document.getElementById("api-key-input");
        const toast = document.getElementById("toast");

        // VPN Setup Elements
        const vpnSetupModal = document.getElementById("vpn-setup-modal");
        const openVpnSetupBtn = document.getElementById("open-vpn-setup");
        const closeVpnSetupBtn = document.getElementById("close-vpn-setup");
        const generateVpnBtn = document.getElementById("generate-vpn-btn");
        const technicianNameInput = document.getElementById("technician-name-input");
        const vpnSetupStep1 = document.getElementById("vpn-setup-step1");
        const vpnSetupStep2 = document.getElementById("vpn-setup-step2");
        const vpnConfigTextarea = document.getElementById("vpn-config-textarea");
        const allocatedIpText = document.getElementById("allocated-ip-text");
        const copyVpnConfigBtn = document.getElementById("copy-vpn-config");
        const downloadVpnConfigBtn = document.getElementById("download-vpn-config");

        let generatedConfig = "";
        let generatedIP = "";

        // App Init
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem("jinom_api_key");
            if (savedKey) {
                apiKeyInput.value = savedKey;
                loadTunnels();
            } else {
                openModal();
            }

            // Event Listeners
            openSettingsBtn.addEventListener("click", openModal);
            closeSettingsBtn.addEventListener("click", closeModal);
            saveSettingsBtn.addEventListener("click", saveApiKey);
            searchBox.addEventListener("input", filterCards);

            // VPN Setup Event Listeners
            openVpnSetupBtn.addEventListener("click", () => {
                vpnSetupStep1.style.display = "block";
                vpnSetupStep2.style.display = "none";
                technicianNameInput.value = "";
                vpnSetupModal.classList.add("active");
            });

            closeVpnSetupBtn.addEventListener("click", () => {
                vpnSetupModal.classList.remove("active");
            });

            generateVpnBtn.addEventListener("click", () => {
                const name = technicianNameInput.value.trim();
                if (!name) {
                    showToast("Nama tidak boleh kosong!", "error");
                    return;
                }

                showToast("Men-generate profil VPN...", "info");
                generateVpnBtn.disabled = true;

                fetch("/api/v1/noc/users", {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ name: name })
                })
                .then(async res => {
                    const json = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        const errMsg = json.error && json.error.message ? json.error.message : "Gagal men-generate profil VPN.";
                        throw new Error(errMsg);
                    }
                    return json;
                })
                .then(json => {
                    const data = json.data || {};
                    generatedConfig = data.config || "";
                    generatedIP = data.ip || "";

                    allocatedIpText.innerText = generatedIP;
                    vpnConfigTextarea.value = generatedConfig;

                    vpnSetupStep1.style.display = "none";
                    vpnSetupStep2.style.display = "flex";
                    showToast("Profil VPN Berhasil Dibuat!", "success");
                })
                .catch(err => {
                    showToast(err.message, "error");
                })
                .finally(() => {
                    generateVpnBtn.disabled = false;
                });
            });

            copyVpnConfigBtn.addEventListener("click", () => {
                navigator.clipboard.writeText(generatedConfig).then(() => {
                    showToast("Konfigurasi disalin!", "success");
                }).catch(() => {
                    showToast("Gagal menyalin konfigurasi.", "error");
                });
            });

            downloadVpnConfigBtn.addEventListener("click", () => {
                const blob = new Blob([generatedConfig], { type: "text/plain;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `jinom-noc-${generatedIP}.conf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast("Berkas .conf diunduh!", "success");
            });

            clearRoutingBtn.addEventListener("click", () => {
                showToast("Memutus jalur routing...", "info");
                // Untuk memutus routing, kita buat request dummy select ke target kosong atau hapus ip rule.
                // Endpoint delete rule tidak diekspos langsung, namun kita bisa membersihkan dengan memilih 00000000-0000-0000-0000-000000000000
                fetch(`/api/v1/tunnels/00000000-0000-0000-0000-000000000000/noc/select`, {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({})
                })
                .then(() => {
                    activeRouteTunnelId = null;
                    localStorage.removeItem("active_route_id");
                    updateRoutingPanel();
                    renderTunnels();
                    showToast("Routing diputus.", "success");
                })
                .catch(() => {
                    // Fallback local cleanup jika mock UUID ditolak
                    activeRouteTunnelId = null;
                    localStorage.removeItem("active_route_id");
                    updateRoutingPanel();
                    renderTunnels();
                });
            });
        });

        function getHeaders() {
            return {
                "X-API-Key": localStorage.getItem("jinom_api_key") || "",
                "Content-Type": "application/json"
            };
        }

        function showToast(message, type = "info") {
            toast.innerText = message;
            toast.style.borderLeftColor = type === "success" ? "var(--status-success)" : 
                                         type === "error" ? "var(--status-error)" : "var(--accent-secondary)";
            toast.classList.add("active");
            setTimeout(() => toast.classList.remove("active"), 3000);
        }

        function openModal() {
            settingsModal.classList.add("active");
        }

        function closeModal() {
            settingsModal.classList.remove("active");
        }

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem("jinom_api_key", key);
                closeModal();
                showToast("API Key disimpan!", "success");
                loadTunnels();
            } else {
                showToast("API Key tidak boleh kosong!", "error");
            }
        }

        // Fetch Tunnels
        function loadTunnels() {
            tunnelsContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-secondary);">Mengambil data terowongan VPN...</div>`;
            
            fetch("/api/v1/tunnels", {
                headers: getHeaders()
            })
            .then(res => {
                if (!res.ok) throw new Error("API Key salah atau server error.");
                return res.json();
            })
            .then(json => {
                tunnels = json.data || [];
                // Sort L2TP tunnels to top
                tunnels.sort((a, b) => (b.vpn_type === 'l2tp') - (a.vpn_type === 'l2tp'));
                
                // Restore active routing session
                activeRouteTunnelId = localStorage.getItem("active_route_id");
                
                // Detect Current Network state
                detectVPNConnection();
                renderTunnels();
                updateRoutingPanel();
            })
            .catch(err => {
                showToast(err.message, "error");
                tunnelsContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--status-error);">Gagal mengambil data: ${err.message}<br><button class="btn-tool" onclick="openModal()" style="margin-top: 1rem;">Perbaiki Kunci API</button></div>`;
            });
        }

        function detectVPNConnection() {
            // Kita hitung status VPN berdasarkan IP teknisi
            // Kita tembak dummy route NOC select tanpa IP untuk memicu deteksi IP client dari Server
            fetch("/api/v1/tunnels/00000000-0000-0000-0000-000000000000/noc/select", {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({})
            })
            .then(res => res.json())
            .then(json => {
                activeTechnicianIp = json.mapped_ip || "";
                if (activeTechnicianIp.startsWith("10.50.")) {
                    vpnBadge.className = "vpn-status-badge";
                    vpnBadgeText.innerText = `NOC VPN: ${activeTechnicianIp}`;
                } else {
                    vpnBadge.className = "vpn-status-badge disconnected";
                    vpnBadgeText.innerText = `Non-NOC IP: ${activeTechnicianIp}`;
                }
            })
            .catch(() => {
                vpnBadge.className = "vpn-status-badge disconnected";
                vpnBadgeText.innerText = "VPN Disconnected";
            });
        }

        function renderTunnels() {
            tunnelsContainer.innerHTML = "";
            const filtered = tunnels.filter(t => t.name.toLowerCase().includes(searchBox.value.toLowerCase()));

            if (filtered.length === 0) {
                tunnelsContainer.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-secondary);">Tidak ada reseller yang cocok dengan kata kunci.</div>`;
                return;
            }

            filtered.forEach(t => {
                const isL2tp = t.vpn_type === 'l2tp';
                const isActive = t.status === 'active';
                const isRouted = activeRouteTunnelId === t.id;

                const card = document.createElement("div");
                card.className = `card ${isRouted ? 'active-route' : ''}`;
                
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <h3 class="reseller-title">${t.name}</h3>
                            <div class="status-badge-inline ${isActive ? '' : 'offline'}" style="margin-top: 0.25rem;">
                                <span class="vpn-pulse"></span>
                                <span>${t.vpn_type.toUpperCase()} - ${isActive ? 'Connected' : 'Disconnected'}</span>
                            </div>
                        </div>
                        <span class="reseller-index">Index #${t.tunnel_index}</span>
                    </div>

                    <div class="card-details">
                        <div class="detail-row">
                            <span class="detail-label">IP Tunnel</span>
                            <span class="detail-value">${t.client_ip_address || '-'}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">IP Publik Router</span>
                            <span class="detail-value">${t.router_ip || '-'}</span>
                        </div>
                    </div>

                    <div class="action-button-group">
                        ${isL2tp ? `
                            <button class="btn-primary ${isRouted ? 'connected' : ''}" onclick="selectTunnel('${t.id}')">
                                ${isRouted ? '✓ Actively Routed' : 'Connect Network'}
                            </button>
                            <div class="link-tools">
                                <a href="http://192.168.1.1" target="_blank" class="btn-tool" ${isRouted ? '' : 'style="opacity: 0.5; pointer-events: none;"'}>Open ONT (1.1)</a>
                                <button class="btn-tool" onclick="copyWinboxCommand('${t.tunnel_index}', '${t.client_ip_address}')">Winbox Link</button>
                            </div>
                        ` : `
                            <button class="btn-primary" style="opacity: 0.5; cursor: not-allowed;" disabled>WireGuard (Bypass Auth)</button>
                        `}
                    </div>
                `;
                tunnelsContainer.appendChild(card);
            });
        }

        function filterCards() {
            renderTunnels();
        }

        function selectTunnel(id) {
            const tunnel = tunnels.find(t => t.id === id);
            if (!tunnel) return;

            showToast(`Menghubungkan ke ${tunnel.name}...`, "info");

            fetch(`/api/v1/tunnels/${id}/noc/select`, {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({})
            })
            .then(async res => {
                const json = await res.json().catch(() => ({}));
                if (!res.ok) {
                    const errMsg = json.error && json.error.message ? json.error.message : "Gagal mengonfigurasi routing.";
                    throw new Error(errMsg);
                }
                return json;
            })
            .then(json => {
                activeRouteTunnelId = id;
                localStorage.setItem("active_route_id", id);
                updateRoutingPanel();
                renderTunnels();
                showToast(`Koneksi ke ${tunnel.name} aktif!`, "success");
            })
            .catch(err => {
                showToast(err.message, "error");
            });
        }

        function updateRoutingPanel() {
            if (activeRouteTunnelId) {
                const active = tunnels.find(t => t.id === activeRouteTunnelId);
                if (active) {
                    routingValue.innerHTML = `Teknisi terhubung ke: <span class="highlight">${active.name}</span> (Index #${active.tunnel_index})`;
                    clearRoutingBtn.style.display = "block";
                    return;
                }
            }
            routingValue.innerHTML = "Tidak ada routing aktif. Hubungkan salah satu reseller di bawah.";
            clearRoutingBtn.style.display = "none";
        }

        function copyWinboxCommand(index, ipStr) {
            const ip = ipStr.split('/')[0];
            const port = 10000 + parseInt(index);
            const cmd = `10.50.0.1:${port}`;
            
            navigator.clipboard.writeText(cmd).then(() => {
                showToast(`Salin alamat Winbox: ${cmd}`, "success");
            }).catch(() => {
                showToast(`Gagal menyalin alamat Winbox.`, "error");
            });
        }
    </script>
</body>
</html>
